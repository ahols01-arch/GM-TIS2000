
name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o GM_Powertrain_Diagnostics_Source.zip -d extracted
          find extracted -name settings.gradle -print
          test -f extracted/GM_Powertrain_Diagnostics/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/GM_Powertrain_Diagnostics
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GM-TIS2000-debug-APK
          path: extracted/GM_Powertrain_Diagnostics/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
